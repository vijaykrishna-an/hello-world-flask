name: CI / CD — Build, Push, Deploy

# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE OVERVIEW
#
#  git push → main
#      │
#      ├── job: test            (every push + every PR)
#      │     └── docker build --target test   ← pytest runs INSIDE Docker
#      │
#      ├── job: build-and-push  (main only, after test passes)
#      │     ├── docker build --target runtime --build-arg APP_VERSION=<sha>
#      │     ├── docker login  → Docker Hub (anvk1729)
#      │     └── docker push  → anvk1729/hello-world-flask:<sha>  + :latest
#      │
#      └── job: update-k8s-tag  (after push succeeds)
#            ├── sed newTag: <sha>  in k8s/kustomization.yaml
#            └── git commit + push  ← ArgoCD detects this change and deploys
#
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths-ignore:
      # The update-k8s-tag job commits to k8s/. Without this guard the commit
      # re-triggers the workflow → infinite loop.
      # (GitHub also doesn't re-trigger on GITHUB_TOKEN pushes — double safety.)
      - "k8s/**"
  pull_request:
    branches: [main]

env:
  DOCKERHUB_USERNAME: anvk1729
  IMAGE_NAME: anvk1729/hello-world-flask

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — test
  # Runs on every push and every PR.
  # Builds only the "test" stage from the Dockerfile which ends with RUN pytest.
  # If any test fails → docker build exits non-zero → job fails → pipeline stops.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test 🧪
    runs-on: [self-hosted, mac, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests inside Docker
        run: |
          docker build --target test \
            --label "sha=${{ github.sha }}" \
            -t ${{ env.IMAGE_NAME }}:test \
            .
          echo "### Tests passed ✅" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — build-and-push
  # Runs ONLY on pushes to main (skipped for PRs).
  # Depends on test — runs only if tests passed.
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push 🐳
    runs-on: [self-hosted, mac, arm64]
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use first 7 chars of the git SHA as the image tag.
      # Immutable, unique, and traces directly back to the exact commit.
      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image-tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_SHA}"

      # Build the slim production image.
      # APP_VERSION is baked in and returned by the Flask "/" endpoint —
      # so after ArgoCD deploys you can curl "/" to confirm which commit is live.
      - name: Build runtime image
        run: |
          docker build \
            --target runtime \
            --build-arg APP_VERSION=${{ steps.tag.outputs.image-tag }} \
            -t ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image-tag }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      # DOCKERHUB_SECRET is set in:
      #   repo → Settings → Secrets and variables → Actions → New repository secret
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_SECRET }}" | \
            docker login -u ${{ env.DOCKERHUB_USERNAME }} --password-stdin

      - name: Push image to Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image-tag }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

      - name: Summary
        run: |
          echo "### Image pushed ✅" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — update-k8s-tag
  # GitOps hand-off: CI edits ONE line in k8s/kustomization.yaml (the image
  # tag) and commits it. ArgoCD polls the repo, detects the change, and runs
  # kubectl apply -k k8s/ — completing the deployment to minikube.
  # ─────────────────────────────────────────────────────────────────────────
  update-k8s-tag:
    name: Update Image Tag in Git 📝
    runs-on: [self-hosted, mac, arm64]
    needs: [build-and-push]
    permissions:
      contents: write   # required to push the tag commit back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in kustomization.yaml
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"

          sed -i '' "s|newName:.*|newName: ${{ env.IMAGE_NAME }}|" k8s/kustomization.yaml
          sed -i '' "s|newTag:.*|newTag: ${IMAGE_TAG}|"             k8s/kustomization.yaml

          echo "Updated kustomization.yaml:"
          grep -A4 "^images:" k8s/kustomization.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "ci: update image tag to ${{ needs.build-and-push.outputs.image-tag }}

          Image: ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}
          Triggered by: ${{ github.actor }}
          Commit: ${{ github.sha }}"
          git push
